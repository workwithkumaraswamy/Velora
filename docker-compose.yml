version: '3.8'

services:
  # MySQL 8 Database
  db:
    image: mysql:8.0
    container_name: velora_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: VeloraRootPassword2026!
      MYSQL_DATABASE: velora_db
      MYSQL_USER: velora_user
      MYSQL_PASSWORD: VeloraPass2026!
    ports:
      - "3306:3306"
    volumes:
      - velora_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "velora_user", "-pVeloraPass2026!"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Node.js Express Backend
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: velora_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api/v1
      DATABASE_URL: "mysql://velora_user:VeloraPass2026!@db:3306/velora_db"
      JWT_SECRET: "velora_jwt_secret_key_luxury_fashion_2026_super_secure"
      JWT_REFRESH_SECRET: "velora_jwt_refresh_secret_luxury_fashion_2026_secure"
      RAZORPAY_KEY_ID: "rzp_test_velora_2026_mock"
      RAZORPAY_KEY_SECRET: "rzp_secret_velora_mock_luxury_dev"
      CLOUDINARY_CLOUD_NAME: "velora-fashion"
      CLOUDINARY_API_KEY: "123456789012345"
      CLOUDINARY_API_SECRET: "mock_cloudinary_secret"
      FREE_SHIPPING_THRESHOLD: "1499"
      STANDARD_SHIPPING_FEE: "99"
    ports:
      - "5000:5000"

  # React Vite Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: velora_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"
      - "80:80"

volumes:
  velora_mysql_data:
    driver: local
